config:
  # Same Cloudflare account as prod (already committed in Pulumi.prod.yaml).
  seichijunrei-infra:cloudflareAccountId: 021233c1880a43aa68565496100e1f8c
  # re-enabled 2026-08-05: token gained Workers Routes (zone) + Workers Scripts (account) edit scopes
  seichijunrei-infra:webRoutesEnabled: "true"
  seichijunrei-infra:cloudflareZoneId: 44fdcc54545c1152a8e730137b671be4
  seichijunrei-infra:stagingDomain: staging.animichi.com
  #
  # ── Hostname cutover (#541), ENABLED 2026-08-05 ────────────────────────
  # Flipping the flag publishes. `webRoutesEnabled` creates the Custom
  # Domain and the /v1, /img, /tiles, /healthz edge routes together. One flag on
  # purpose — a hostname that resolves before its routes are narrowed answers a
  # browser navigation with the edge Worker's JSON 404.
  #
  #   pulumi config set webRoutesEnabled true                   --stack staging
  #   pulumi config set cloudflareZoneId <animichi.com zone id> --stack staging
  #   pulumi config set stagingDomain staging.animichi.com      --stack staging
  #
  # The key is `stagingDomain`, NOT `webDomain`. `webDomain` is the prod apex and
  # is read only on the prod stack. An earlier version of this comment said
  # `webDomain` here; following it would leave `stagingDomain` unset and fail the
  # apply with "Missing required configuration variable".
  #
  # ── Staging access = Cloudflare Access (#1369), since 2026-09-08 ──────────
  # `infra/src/staging-access.ts` puts one `ZeroTrustAccessApplication` in front
  # of `stagingDomain` and the two `animichi-*-staging` workers.dev origins.
  # Humans sign in against the identity policy built from the list below;
  # automation presents the `animichi-staging-ci` service token, whose two
  # halves reach every caller as `CF_ACCESS_CLIENT_ID` / `CF_ACCESS_CLIENT_SECRET`
  # through the ESC environment `lifeodyssey/animichi/staging`. Nothing is copied
  # by hand and no credential is configured here.
  #
  # This replaced the hand-written WAF gate (`stagingGateEnabled`,
  # `stagingGateToken`, `stagingAllowedIps`, all deleted with #1369, along with
  # `scripts/setup-staging-gate.sh` and the GitHub `STAGING_GATE_TOKEN` secret).
  # A WAF rule can only see hostnames on the zone, so the workers.dev origins CD
  # smoke-tests were never behind it (#539).
  #
  # The list is who may SIGN IN, not a secret — plain config so it is reviewable.
  # An empty list is refused at build time: an `allow` policy with no include
  # rules is an application no human can open.
  #
  #   pulumi config set --path 'stagingAccessAllowedEmails[0]' <address> --stack staging
  seichijunrei-infra:stagingAccessAllowedEmails:
    - zhouthepassion@gmail.com
    - zhenjiazhou0127@gmail.com
