# The CD queue extension is retired by selected-artifact delivery (#1564).
paths:
  # Owner-approved: GitHub supports $/; actionlint v1.7.12 does not (upstream #711/#732).
  # Remove after the installed official actionlint accepts this syntax without an ignore.
  .github/workflows/pr-verification.yml:
    ignore:
      - '^specifying action "\$/\.github/actions/setup\-workspace" in invalid format because ref is missing\. available formats are "\{owner\}/\{repo\}@\{ref\}" or "\{owner\}/\{repo\}/\{path\}@\{ref\}"$'
  # Owner-approved: the same upstream syntax gap, limited to the release hydration action.
  .github/workflows/cd.yml:
    ignore:
      - '^specifying action "\$/\.github/actions/hydrate\-release" in invalid format because ref is missing\. available formats are "\{owner\}/\{repo\}@\{ref\}" or "\{owner\}/\{repo\}/\{path\}@\{ref\}"$'
