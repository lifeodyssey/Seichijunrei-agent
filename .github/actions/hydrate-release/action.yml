name: Hydrate selected release
description: Download the resolved immutable artifact and verify its complete source closure
inputs:
  artifact-id:
    description: Immutable artifact ID from the trusted provenance resolver
    required: true
  run-id:
    description: Producing run ID from the trusted provenance resolver
    required: true
runs:
  using: composite
  steps:
    - name: Download the selected snapshot
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        run-id: ${{ inputs.run-id }}
        repository: lifeodyssey/animichi
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: incoming
    - name: Verify the selected snapshot
      shell: bash
      run: ruby .github/scripts/release/verify.rb
