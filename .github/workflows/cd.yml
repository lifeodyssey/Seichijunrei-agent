# Main-line delivery (CI/CD redesign spec §3.4, card C1 / #1364).
#
# One push, one plan, ONE build, one artifact, five ordered staging stages, one
# smoke probe, one production promotion of the same bytes. The affected set is
# pnpm's — `--filter "...[<before>]"` selects every workspace project whose
# files changed plus every dependent — so there is no components.json, no
# change-plan.py and no cd-cohort-plan.py to drift from CI's router.
#
# What is still written by hand, and why:
#
#   plan      two guards. A zero or unreachable `before` falls back to `HEAD~1`
#             (first push, force push, rewritten history); `github.sha` must
#             still be the head of origin/main, so a rerun of a run that a newer
#             push has overtaken deploys nothing (spec §六 #3).
#   pairing   two rules, both because a deploy unit's inputs live outside its own
#             pnpm project. `stage-edge` also fires on an `apps/agent` change
#             because the edge Worker carries the agent container image (W4
#             removes the image and this half of the condition with it). The
#             migrator image bakes `migrations/neon`, which no pnpm project
#             contains, so every migrator step — image, bundle, deploy — also
#             fires on a `migrations/neon` change, and so does `stage-migration`.
#   handshake `scripts/delivery/migrate-through-worker.sh` — staging migrates
#             only through the migrator Worker, on the job's own OIDC identity.
#   smoke     the two staging surfaces and the retry window.
#
# Concurrency is per job, not per workflow: `cd-staging` for the five stages and
# the smoke probe, `cd-production` for the promotion. A run parked at the
# production approval gate no longer holds the staging lane (#1204 / #1325), and
# `queue: max` orders up to 100 pending jobs per group instead of cancelling the
# one already waiting (owner decision, spec §六 #3). actionlint has no schema
# entry for `queue` — see .github/actionlint.yaml.
#
# This file holds no credential (#1367). Every job that needs one proves who it
# is instead: `environment:` puts `environment:<name>` into the job's OIDC
# subject, which is the only subject shape the Pulumi Cloud issuer policy
# accepts (spec §3.5); `pulumi/auth-actions` exchanges that token for a personal
# Pulumi token — the only type an individual-edition organization can mint — and
# `pulumi/esc-action` opens that stage's ESC environment and exports the one or
# two names the stage publishes with. `CLOUDFLARE_ACCOUNT_ID` is a repository
# variable, not a secret: it is an account identifier, and storing an identifier
# as a secret only hid it from the log that needed it.
#
# Shape contract: .github/scripts/test_cd_shape_contract.rb.
name: CD
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: CD / plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.pnpm.outputs.packages }}
      deploy: ${{ steps.pnpm.outputs.deploy }}
      agent: ${{ steps.paths.outputs.agent }}
      migrations: ${{ steps.paths.outputs.migrations }}
      infra: ${{ steps.paths.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve the deployable range and refuse a superseded head
        id: range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$EVENT_BEFORE"
          # A first push and every force push report a 40-zero `before`; a
          # rewritten history reports one this clone does not have. Both fall
          # back to the parent commit. CD's range is `before..sha` and nothing
          # else — there is no deployment-record baseline (spec decision 3).
          if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          # A rerun of a run a newer push has already overtaken would publish an
          # older tree over a newer one. `queue: max` orders the live runs; this
          # refuses the stale rerun outright, before anything is built.
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$HEAD_SHA" ]; then
            echo "::error::main is at $remote_head, past this run's $HEAD_SHA — refusing to deploy a superseded tree"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # `migrations/neon` and `infra/database-access` sit outside the pnpm
      # project graph, and `apps/agent` is a pnpm project whose deploy unit is a
      # container image rather than a Worker bundle — all three are routed by
      # path instead.
      - name: Filter the paths the package graph cannot see
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.range.outputs.base }}
          ref: ${{ github.sha }}
          filters: |
            agent:
              - 'apps/agent/**'
            migrations:
              - 'migrations/neon/**'
            infra:
              - 'infra/**'
      - name: Select the affected packages
        id: pnpm
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          AGENT_CHANGED: ${{ steps.paths.outputs.agent }}
          MIGRATIONS_CHANGED: ${{ steps.paths.outputs.migrations }}
          INFRA_CHANGED: ${{ steps.paths.outputs.infra }}
        run: |
          set -euo pipefail
          # Subtracted for the same reason CI subtracts them: the root project
          # has no deploy unit, `@animichi/agent` deploys as a container image
          # routed by path above, and `animichi-e2e` is a test suite.
          packages="$(pnpm ls -r --depth -1 --json --filter "...[$BASE_SHA]" \
            | jq -c '[.[].name] - ["animichi-cloudflare-worker", "@animichi/agent", "animichi-e2e"]')"
          # `packages` also carries library projects (contract, eval,
          # test-postgres) that no stage deploys. The five names below are the
          # deployable ones; without this filter a push touching only a library
          # would start a build with nothing to package and no stage to run it.
          deployable="$(jq -c '[.[] | select(. == "catalog" or . == "edge-worker" or . == "migrator" or . == "users" or . == "web")]' <<< "$packages")"
          deploy=false
          if [ "$deployable" != "[]" ] ||
             [ "$AGENT_CHANGED" = true ] ||
             [ "$MIGRATIONS_CHANGED" = true ] ||
             [ "$INFRA_CHANGED" = true ]; then
            deploy=true
          fi
          {
            echo "packages=$packages"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Range: $BASE_SHA..$HEAD_SHA"
            echo "Affected packages: $packages"
            echo "Deployable: $deployable (agent=$AGENT_CHANGED migrations=$MIGRATIONS_CHANGED infra=$INFRA_CHANGED)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The only build in this workflow. Everything below downloads what this job
  # produced; `promote-production` has no build step at all, so production
  # publishes the bytes staging was smoke-checked on.
  build:
    name: CD / build
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # The container registry is account-scoped rather than per-environment: this
    # job pushes the one image both environments will run. It still declares an
    # environment because a job that asks Pulumi Cloud for a token has to
    # present an `environment:` subject (§3.5), and `staging` is the one without
    # an approval gate — production's reviewer must not be woken up to build.
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      # The registry push needs a Cloudflare token, and this job opens it from
      # ESC with its own OIDC identity rather than reading a stored one.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Log into Pulumi Cloud with GitHub OIDC
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      # The ESC action installs a Pulumi CLI and prepends it to PATH. Unpinned
      # it fetches whatever `pulumi.com/latest-version` answers, so every job
      # that opens an environment resolves the repository's pin first.
      - name: Resolve the pinned Pulumi CLI version
        id: pulumi-cli
        run: printf 'version=%s\n' "$(cat .pulumi.version)" >> "$GITHUB_OUTPUT"
      # `export-environment-variables` is a mapping list, not a boolean: a
      # comma-separated value exports exactly those names and nothing else
      # (esc-action v3.2.0, src/parse-mapping.ts). It is an allowlist over the
      # environment's `environmentVariables` block alone, and only over what
      # reaches this job's env — the action publishes every `environmentVariables`
      # value as a step output whatever this list says. So the allowlist is not
      # the boundary; where a value lives inside ESC is. That is why the edge
      # runtime's eight secrets go under `pulumiConfig` as `fn::secret`, read by
      # Pulumi and never by a publishing job (ADR 0003, card D4).
      - name: Open the staging ESC environment
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3.2.0
        with:
          version: ${{ steps.pulumi-cli.outputs.version }}
          environment: lifeodyssey/animichi/staging
          export-environment-variables: CLOUDFLARE_API_TOKEN
      # `pulumi/esc-action` only warns when an exported name has no value in the
      # environment (v3.2.0 `src/index.ts:327`, `core.warning`) and exits 0, so
      # a mis-projected key would reach Wrangler as an empty token and fail
      # somewhere far less legible than here.
      - name: Refuse to continue on a value ESC did not supply
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN; do
            [ -n "${!key:-}" ] || { echo "::error::$key is missing from the ESC environment"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the web output
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'web') }}
        run: |
          set -euo pipefail
          pnpm --filter web build
          mkdir -p release/web
          cp -R apps/web/.output release/web/.output
          cp apps/web/wrangler.jsonc release/web/wrangler.jsonc
      - name: Bundle the catalog Worker
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'catalog') }}
        run: bash .github/scripts/bundle-release-worker.sh catalog production
      - name: Bundle the users Worker
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'users') }}
        run: bash .github/scripts/bundle-release-worker.sh users production
      - name: Set up Buildx for the container images
        if: ${{ needs.plan.outputs.agent == 'true' || contains(fromJSON(needs.plan.outputs.packages), 'edge-worker') || contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # The edge Worker runs the agent image, so an edge deploy needs one even
      # when `apps/agent` itself did not change — same pairing as `stage-edge`.
      - name: Build the agent image
        if: ${{ needs.plan.outputs.agent == 'true' || contains(fromJSON(needs.plan.outputs.packages), 'edge-worker') }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/agent/Dockerfile
          load: true
          push: false
          tags: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-agent:sha-${{ github.sha }}
      # `CLOUDFLARE_API_TOKEN` is already in this job's environment: the ESC step
      # above appended it to `GITHUB_ENV`, and wrangler reads it from there.
      - name: Push the agent image
        if: ${{ needs.plan.outputs.agent == 'true' || contains(fromJSON(needs.plan.outputs.packages), 'edge-worker') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_REF: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-agent:sha-${{ github.sha }}
        run: pnpm exec wrangler containers push "$IMAGE_REF"
      - name: Bundle the edge Worker
        if: ${{ needs.plan.outputs.agent == 'true' || contains(fromJSON(needs.plan.outputs.packages), 'edge-worker') }}
        env:
          IMAGE_REF: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-agent:sha-${{ github.sha }}
        run: bash .github/scripts/bundle-release-worker.sh edge production "$IMAGE_REF"
      # The migrator image bakes the migration chain (`workers/migrator/Dockerfile`
      # `COPY migrations/neon /migrations`), and `migrations/neon` is outside every
      # pnpm project — so a migrations-only push selects no package at all. Without
      # the `migrations` half of this condition the run would POST a new head to a
      # migrator still carrying the old chain and get `head_mismatch`. Same pairing
      # rule as agent+edge above; the retired router spelled it
      # `IMMUTABLE_PAIRS = ({"agent","edge"}, {"migrator","db"})`.
      - name: Build the migrator image
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: workers/migrator/Dockerfile
          load: true
          push: false
          tags: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-migrator:sha-${{ github.sha }}
      - name: Push the migrator image
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_REF: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-migrator:sha-${{ github.sha }}
        run: pnpm exec wrangler containers push "$IMAGE_REF"
      - name: Bundle the migrator Worker
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true' }}
        env:
          IMAGE_REF: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/animichi-migrator:sha-${{ github.sha }}
        run: bash .github/scripts/bundle-release-worker.sh migrator staging "$IMAGE_REF"
      - name: Seal the migration chain
        if: ${{ needs.plan.outputs.migrations == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p release/migrations
          cp -R migrations/neon/. release/migrations/
      # The database-access program imports `@pulumi/neon`, a provider SDK that
      # is generated rather than published; the sealed copy is what the staging
      # and production stacks install, so both apply the same generated code.
      # Generating it needs the CLI, which is why this job installs one too.
      - name: Install the pinned Pulumi CLI for the SDK generation
        if: ${{ needs.plan.outputs.infra == 'true' }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Seal the Pulumi programs with their generated Neon SDK
        if: ${{ needs.plan.outputs.infra == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ( cd infra/database-access
            pulumi package add terraform-provider kislerdm/neon
            git restore package.json
            pnpm install --frozen-lockfile )
          out=release/foundation
          mkdir -p "$out"
          git archive "$SOURCE_SHA" infra | tar -x -C "$out"
          built=infra/database-access/node_modules/@pulumi/neon
          sealed="$out/infra/database-access/sdks/neon"
          [ -f "$built/bin/index.js" ] || { echo "::error::built Neon provider SDK entrypoint is missing"; exit 1; }
          mkdir -p "$out/infra/database-access/sdks"
          cp -RL "$built" "$sealed"
          [ -f "$sealed/bin/index.js" ] || { echo "::error::sealed Neon provider SDK entrypoint is missing"; exit 1; }
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml .pulumi.version "$out/"
      # `upload-artifact` zips, and a zip does not carry file permissions; the
      # tar inside it does. `--sort`/`--mtime`/`--owner` make the archive a
      # function of its contents so the digest below identifies the tree.
      - name: Archive the release tree
        run: |
          set -euo pipefail
          [ -d release ] || { echo "::error::plan said this push deploys, but nothing was built"; exit 1; }
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf release.tar release
      - name: Publish the release artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Record the artifact identity
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_NAME: release-${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Release artifact"
            echo "- name: $ARTIFACT_NAME"
            echo "- artifact-digest: $ARTIFACT_DIGEST"
            echo '```'
            tar -tvf release.tar
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # `!failure()` and `!cancelled()` are evaluated over every ancestor in the
  # dependency chain, not only the jobs named in `needs` (measured 2026-09-07,
  # runs 34134624640 / 34134828691) — so this guard, not the `needs` list, is
  # what stops a red stage here, and it must stay even if `needs` is shortened.
  # A stage skipped because its unit was not affected is `skipped`, not failed,
  # and that is the skip this chain must keep allowing.
  stage-foundation:
    name: CD / staging foundation
    needs: [plan, build]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.plan.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: cd-staging
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    permissions:
      contents: read
      # Pulumi Cloud login is OIDC (#1077), not a stored access token; the same
      # identity opens the ESC environment holding the Pulumi-plane tokens.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
      - run: tar -xf release.tar
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install the pinned Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Log into Pulumi Cloud with GitHub OIDC
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      # The ESC action installs a Pulumi CLI and prepends it to PATH. Unpinned
      # it fetches the latest release and shadows the `.pulumi.version` CLI the
      # step above installed; given the same version it downloads nothing.
      - name: Resolve the pinned Pulumi CLI version
        id: pulumi-cli
        run: printf 'version=%s\n' "$(cat .pulumi.version)" >> "$GITHUB_OUTPUT"
      # Two names, because this is the only staging job that touches Neon's
      # control plane; every other stage opens the same environment for the
      # publish token alone. What the list can and cannot promise is spelled out
      # over the `build` job's ESC step.
      - name: Open the staging ESC environment
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3.2.0
        with:
          version: ${{ steps.pulumi-cli.outputs.version }}
          environment: lifeodyssey/animichi/staging
          export-environment-variables: CLOUDFLARE_API_TOKEN,NEON_API_KEY
      - name: Refuse to continue on a value ESC did not supply
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN NEON_API_KEY; do
            [ -n "${!key:-}" ] || { echo "::error::$key is missing from the ESC environment"; exit 1; }
          done
      - name: Install the sealed Pulumi programs
        run: |
          set -euo pipefail
          pnpm install --dir release/foundation --frozen-lockfile --ignore-scripts
          pnpm install --dir release/foundation/infra/database-access --frozen-lockfile --ignore-scripts
      - name: Apply the staging database-access stack
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          command: up
          stack-name: lifeodyssey/staging
          work-dir: release/foundation/infra/database-access
      # Only when this push carries schema changes: the shared reset drops and
      # recreates the staging `public` schema, and firing it on every foundation
      # promotion was the #1216 defect.
      - name: Reset the staging schema baseline
        if: ${{ needs.plan.outputs.migrations == 'true' }}
        run: bash release/foundation/infra/database-access/reset-staging-baseline.sh
      - name: Apply the staging topology stack
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          command: up
          stack-name: lifeodyssey/staging
          work-dir: release/foundation/infra

  stage-migration:
    name: CD / staging migration
    needs: [plan, build, stage-foundation]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && (contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true') }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: cd-staging
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    permissions:
      contents: read
      # The migrator Worker verifies this job's own OIDC token; CI never holds a
      # database credential, not even a short-lived one (decision 6).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
      - run: tar -xf release.tar
      # wrangler-action runs Wrangler through `npx`, so the Node the runner
      # image happens to ship is otherwise the version that publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Log into Pulumi Cloud with GitHub OIDC
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      - name: Resolve the pinned Pulumi CLI version
        id: pulumi-cli
        run: printf 'version=%s\n' "$(cat .pulumi.version)" >> "$GITHUB_OUTPUT"
      - name: Open the staging ESC environment
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3.2.0
        with:
          version: ${{ steps.pulumi-cli.outputs.version }}
          environment: lifeodyssey/animichi/staging
          export-environment-variables: CLOUDFLARE_API_TOKEN
      - name: Refuse to continue on a value ESC did not supply
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN; do
            [ -n "${!key:-}" ] || { echo "::error::$key is missing from the ESC environment"; exit 1; }
          done
      # `apiToken` is passed explicitly even though ESC already put the value in
      # this job's environment: wrangler-action assigns
      # `process.env.CLOUDFLARE_API_TOKEN = getInput("apiToken")` unconditionally
      # (v4.0.0 `authenticationSetup`), so leaving the input out overwrites the
      # exported value with the empty string and the deploy fails unauthenticated.
      - name: Deploy the migrator Worker
        if: ${{ contains(fromJSON(needs.plan.outputs.packages), 'migrator') || needs.plan.outputs.migrations == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          packageManager: npm
          workingDirectory: release
          command: deploy migrator/bundle/index.js --no-bundle --config migrator/wrangler.toml --env staging --tag sha-${{ github.sha }}
      - name: Migrate staging through the migrator Worker
        if: ${{ needs.plan.outputs.migrations == 'true' }}
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_STAGING_URL }}
        run: bash scripts/delivery/migrate-through-worker.sh staging
      # C3 one-time verification, delete after the first green run (#1365).
      # Proves the production door refuses this job's staging token in the live
      # deployment, not only in workers/migrator/test/policy.test.ts.
      - name: Verify the production migrator refuses a staging token
        if: ${{ needs.plan.outputs.migrations == 'true' }}
        env:
          MIGRATOR_PRODUCTION_URL: ${{ vars.MIGRATOR_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          # Both calls carry a bearer credential, so curl refuses any transport
          # below https — including a redirect off it (CWE-319), matching
          # scripts/delivery/migrate-through-worker.sh.
          token="$(curl --proto '=https' --proto-redir '=https' -sSfL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=animichi:github-actions:migrator" | jq -er .value)"
          code="$(curl --proto '=https' --proto-redir '=https' -sS -o /dev/null -w '%{http_code}' -X POST \
            "$MIGRATOR_PRODUCTION_URL/migrate" -H "Authorization: Bearer $token" \
            -H 'content-type: application/json' --max-time 60 -d '{}')"
          echo "production migrator answered HTTP $code to a staging token"
          [ "$code" = 403 ] || { echo "::error::expected 403, got $code"; exit 1; }

